name: Build & Publish Release APK

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type: "test" for testing, "official" for formal release'
        required: true
        type: choice
        options:
          - test
          - official
        default: test
  push:
    tags:
      - '*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  Gradle:
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v6
    - name: setup jdk
      uses: actions/setup-java@v5.2.0
      with:
        distribution: 'temurin'
        java-version: '17'
        java-package: jdk
    - name: Make Gradle executable
      run: chmod +x ./gradlew
    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/keystore.jks
    - name: Build APK
      run: ./gradlew assembleRelease --stacktrace
      env:
        KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    - name: Releasing using Hub
      uses: wangmuxi-luchi/release-apk@main
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}
        APP_FOLDER: app
        TRIGGER_TYPE: ${{ github.event_name }}_${{ github.event.inputs.release_type || 'official' }}